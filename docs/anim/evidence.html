<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Animation</title>
<style>
  :root{
    --bg:#020617; --grid:#1e293b;
    --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24;
    --rose:#fb7185; --orange:#fb923c; --slate:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#050a18;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;overflow:hidden}

  #wrap{position:relative;width:100%;max-width:1920px;flex:1;display:flex;align-items:center;justify-content:center}
  svg#stage{width:100%;height:100%;display:block}

  /* ---------- 入场 ---------- */
  .node,.chip,.note{opacity:0;transform:scale(.72);transform-box:fill-box;transform-origin:center;
    transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1.35)}
  .node.on,.chip.on,.note.on{opacity:1;transform:scale(1)}
  .edge{transition:stroke-dashoffset 1.1s ease .05s}
  .node.on .box{animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}

  .loop-anim{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .popbase{opacity:0;transform-box:fill-box;transform-origin:center}
  .popbase.pop{animation:popin .6s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes popin{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}

  .burst-base{opacity:0;transform-box:fill-box;transform-origin:center}
  .burst-base.go{animation:burst 1.3s ease-out forwards}
  @keyframes burst{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}

  .particle{filter:drop-shadow(0 0 4px currentColor)}

  /* ---------- ?t= 调试模式：跳过过渡直达终态（headless 截图用） ---------- */
  svg.instant .node,svg.instant .chip,svg.instant .note,svg.instant .edge{transition:none!important}
  svg.instant .popbase.pop{animation:none!important;opacity:1}
  svg.instant .node.on .box{animation:none!important;filter:drop-shadow(0 0 6px currentColor)}

  /* ---------- 字幕条 ---------- */
  #caption{width:100%;max-width:1920px;padding:12px 28px;background:#0b1226;border-top:1px solid #1e293b;
    font-size:15px;color:#cbd5e1;display:flex;align-items:center;gap:16px;min-height:56px}
  #cap-idx{color:#64748b;font-size:12px;white-space:nowrap}
  #cap-text{transition:opacity .4s}

  /* ---------- 控制 ---------- */
  #ctrl{position:fixed;top:14px;left:16px;display:flex;gap:8px;z-index:9}
  #ctrl button{background:#0b1226;color:#94a3b8;border:1px solid #334155;border-radius:6px;
    width:38px;height:32px;font-size:15px;cursor:pointer;font-family:inherit}
  #ctrl button:hover{color:#e2e8f0;border-color:#64748b}
</style>
</head>
<body>
<div id="wrap">
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="46%" r="75%">
      <stop offset="55%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
</svg>
</div>

<div id="caption"><span id="cap-idx">01/01</span><span id="cap-text"></span></div>
<div id="ctrl"><button id="btn-pp" title="暂停/继续">⏸</button><button id="btn-rp" title="重播">↻</button></div>

<script>
(function(){
/* ==================== CONFIG START（唯一允许修改的区域） ==================== */
const CONFIG = {
  title: 'Tally · 证据组装：页窗 · 拼块 · 前置',
  subtitle: 'hits 去重首命中页 → ±2 兄弟块窗（small-to-big）→ stitch_adjacent 标签重接 → 表页前置 —— 少即是准',
  legend: [{color:'cyan',text:'产出/证据'},{color:'violet',text:'组装'},{color:'amber',text:'处理'},{color:'rose',text:'实测/风控'},{color:'orange',text:'输入'}],
  nodes: [
    {id:'hits',x:170,  y:620, w:130, h:130, color:'orange',shape:'circle', title:'hits', sub:'top-8'},
    {id:'ded', x:447,  y:620, w:200, h:110, color:'violet',title:'去重首命中页', sub:'页级分层'},
    {id:'win', x:723,  y:620, w:210, h:110, color:'violet',title:'±2 兄弟块窗', sub:'small-to-big', sub2:'小块检索·大块生成'},
    {id:'sti', x:1000, y:620, w:210, h:110, color:'amber', title:'stitch_adjacent', sub:'标签/数字重接', sub2:'同页表块'},
    {id:'fro', x:1277, y:620, w:190, h:110, color:'amber', title:'表页前置', sub:'front_key_table', sub2:'主要会计数据'},
    {id:'pool',x:1553, y:620, w:190, h:110, color:'cyan',  title:'证据池', sub:'硬帽封顶', sub2:'被引∪hits'},
    {id:'gen', x:1830, y:620, w:140, h:140, color:'cyan',  shape:'circle', title:'generate', sub:'句级引用'},
  ],
  edges: [
    {id:'e-1', d:'M 235,620 L 347,620'},
    {id:'e-2', d:'M 547,620 L 618,620'},
    {id:'e-3', d:'M 828,620 L 895,620'},
    {id:'e-4', d:'M 1105,620 L 1182,620'},
    {id:'e-5', d:'M 1372,620 L 1458,620'},
    {id:'e-6', d:'M 1648,620 L 1760,620'},
  ],
  flows: [
    {id:'f-1',edge:'e-1',color:'orange',n:3, speed:.20},
    {id:'f-2',edge:'e-2',color:'violet',n:3, speed:.20},
    {id:'f-3',edge:'e-3',color:'violet',n:3, speed:.20},
    {id:'f-4',edge:'e-4',color:'amber', n:3, speed:.20},
    {id:'f-5',edge:'e-5',color:'amber', n:3, speed:.20},
    {id:'f-6',edge:'e-6',color:'cyan',  n:3, speed:.22},
  ],
  orbits: [],
  chips: [
    {id:'c-1', x:430, y:790, w:180, color:'violet',text:'窗口只盖首命中页'},
    {id:'c-2', x:660, y:790, w:160, color:'cyan',  text:'抽取窗 hits[:12]'},
    {id:'c-3', x:890, y:790, w:160, color:'cyan',  text:'引用=句级+页码'},
    {id:'c-4', x:1130,y:790, w:170, color:'rose',  text:'被引∪hits=对账面'},
  ],
  notes: [
    {id:'nt-un',x:330, y:160, w:420, h:90, color:'rose', dashed:true,
     lines:[{text:'union 窗实测净负（7.2）',size:13,color:'#fda4af',dy:30},
            {text:'无关块稀释注意力、带偏抽取式打分',size:12,color:'#94a3b8',dy:52},
            {text:'—— 上下文不是越多越好，少即是准',size:12,color:'#94a3b8',dy:72}]},
    {id:'nt-nm',x:1170,y:155, w:380, h:72, color:'violet', dashed:true,
     lines:[{text:'学名：sentence-window / small-to-big（LlamaIndex）',size:12.5,color:'#c4b5fd',dy:28},
            {text:'引用学名：Attributed QA（ch07 前沿一瞥）',size:11.5,color:'#94a3b8',dy:50}]},
  ],
  pops: [
    {id:'p-ord',x:1277, y:530, text:'真值行在词法上输给无数字的表头块——所以前置', color:'amber', size:12},
  ],
  metrics: [
    {id:'m-hit',x:1830, y:735, color:'cyan', size:14, prefix:'innolight answer_hit ', to:1.00, decimals:2, dur:1.6},
    {id:'m-p8', x:1830, y:765, color:'cyan', size:13, prefix:'chunk P/R@8 ', to:1.00, decimals:2, dur:1.4,
     note:{text:'heuristic 全集', dy:26}},
  ],
  bursts: [
    {id:'b-g',x:1830, y:620, r:72, color:'cyan'},
  ],
  scenes: [
    {t:0.0, cap:'证据组装三件套：页窗 / 拼块 / 前置——每件一个实测教训'},
    {t:1.2, cap:'检索单元进场：hits top-8（词面命中的小块）', on:['hits','e-1','f-1']},
    {t:3.4, cap:'去重首命中页：同一页多个命中只开一个窗（页级分层）', on:['ded','e-2','f-2','c-1']},
    {t:5.8, cap:'±2 兄弟块窗：小块检索、大块生成——学名 small-to-big', on:['win','e-3','f-3','nt-nm']},
    {t:8.6, cap:'union 窗的教训：无关块稀释注意力、带偏打分——少即是准', on:['nt-un']},
    {t:11.0,cap:'stitch_adjacent：同页标签块与数字块重接（断词标签 SPLIT_FIX 同族）', on:['sti','e-4','f-4']},
    {t:13.6,cap:'表页前置：真值行在词法上输给无数字表头——把「主要会计数据」顶上去', on:['fro','e-5','f-5','p-ord']},
    {t:16.4,cap:'证据池（被引∪hits=verify 对账面）→ generate 句级引用', on:['pool','gen','e-6','f-6','b-g','c-2','c-3','c-4']},
    {t:19.6,cap:'量尺：answer_hit 1.00 · chunk P/R@8（heuristic 全集）', on:['m-hit','m-p8']},
    {t:24.0,cap:'—— 流水线持续运行中（↻ 重播）——'},
  ],
};

/* ==================== CONFIG END ==================== */

/* ==================== 引擎（勿改） ==================== */
const $=s=>document.querySelector(s);
const svg=$('#stage');
const PAL={cyan:'#22d3ee',violet:'#a78bfa',amber:'#fbbf24',rose:'#fb7185',orange:'#fb923c',slate:'#94a3b8',dim:'#64748b'};
const FILL={cyan:'rgba(8,51,68,.4)',violet:'rgba(76,29,149,.35)',amber:'rgba(120,53,15,.25)',
            rose:'rgba(136,19,55,.25)',orange:'rgba(251,146,60,.2)',slate:'rgba(30,41,59,.5)'};
const col=c=>PAL[c]||c, fill=c=>FILL[c]||'rgba(30,41,59,.4)';
const defs=svg.querySelector('defs');
function el(t,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',t);
  for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}

/* ---------- 背景 ---------- */
el('rect',{width:1920,height:1080,fill:'#020617'});
el('rect',{width:1920,height:1080,fill:'url(#grid)'});
el('rect',{width:1920,height:1080,fill:'url(#vig)'});

/* ---------- 标题 / 图例 ---------- */
if(CONFIG.title){
  const t=el('text',{x:960,y:58,fill:'#f1f5f9','font-size':30,'font-weight':700,'text-anchor':'middle','letter-spacing':2});
  t.textContent=CONFIG.title;
}
if(CONFIG.subtitle){
  const s=el('text',{x:960,y:92,fill:'#64748b','font-size':15,'text-anchor':'middle'});
  s.textContent=CONFIG.subtitle;
}
let lx=1400;
(CONFIG.legend||[]).forEach(l=>{
  el('circle',{cx:lx,cy:48,r:5,fill:col(l.color)});
  const t=el('text',{x:lx+12,y:52,fill:'#64748b','font-size':12});t.textContent=l.text;
  lx+=24+[...l.text].reduce((a,ch)=>a+(/[^\x00-\xff]/.test(ch)?13:8),0)+28;
});

/* ---------- 箭头 marker（按颜色动态生成） ---------- */
function markerFor(color){
  const id='arr-'+color.replace('#','');
  if(!document.getElementById(id)){
    const m=el('marker',{id,markerWidth:10,markerHeight:7,refX:9,refY:3.5,orient:'auto'},defs);
    el('polygon',{points:'0 0, 10 3.5, 0 7',fill:color},m);
  }
  return 'url(#'+id+')';
}

/* ---------- 注册表：id → {type,...}，scene.on 统一分发 ---------- */
const REG={};
const METRICS=[];

/* ---------- nodes ---------- */
(CONFIG.nodes||[]).forEach(n=>{
  const c=col(n.color);
  const g=el('g',{id:n.id,'class':'node',color:c});
  if(n.shape==='circle'){
    el('circle',{'class':'box',cx:n.x,cy:n.y,r:n.w/2,fill:'rgba(8,51,68,.5)',stroke:c,'stroke-width':2},g);
    const t1=el('text',{x:n.x,y:n.y-6,fill:'#fff','font-size':17,'font-weight':700,'text-anchor':'middle'},g);
    t1.textContent=n.title;
    if(n.sub){const t2=el('text',{x:n.x,y:n.y+18,fill:'#fff','font-size':17,'font-weight':700,'text-anchor':'middle'},g);t2.textContent=n.sub;}
  }else{
    el('rect',{'class':'box',x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:10,fill:fill(n.color),stroke:c,'stroke-width':1.5},g);
    const t1=el('text',{x:n.x,y:n.y-24,fill:'#fff','font-size':16,'font-weight':600,'text-anchor':'middle'},g);
    t1.textContent=n.title;
    if(n.sub){const t2=el('text',{x:n.x,y:n.y+2,fill:'#94a3b8','font-size':12,'text-anchor':'middle'},g);t2.textContent=n.sub;}
    if(n.sub2){const t3=el('text',{x:n.x,y:n.y+24,fill:'#64748b','font-size':11,'text-anchor':'middle'},g);t3.textContent=n.sub2;}
  }
  REG[n.id]={type:'node',el:g};
});

/* ---------- edges ---------- */
(CONFIG.edges||[]).forEach(e=>{
  const c=col(e.color||'slate');
  const p=el('path',{id:e.id,'class':'edge',d:e.d,fill:'none',stroke:c,
    'stroke-width':e.width||2,'marker-end':e.arrow===false?'none':markerFor(c)});
  if(e.dashed)p.setAttribute('stroke-dasharray','7,6');
  REG[e.id]={type:'edge',el:p,dashed:!!e.dashed};
});
/* 画线动画预置：实线用 dashoffset 生长，虚线用透明度渐显 */
Object.values(REG).filter(r=>r.type==='edge').forEach(r=>{
  const e=r.el, len=e.getTotalLength();
  if(r.dashed){e.style.transition='opacity 1s ease';e.style.opacity=0;r.mode='fade';}
  else{e.dataset.len=len;e.style.strokeDasharray=len;e.style.strokeDashoffset=len;r.mode='draw';}
});

/* ---------- flows（粒子沿 edge 轨迹） ---------- */
const pLayer=el('g',{id:'particles'});
(CONFIG.flows||[]).forEach(f=>{
  const src=REG[f.edge]; if(!src||src.type!=='edge')return;
  const tr=el('path',{d:src.el.getAttribute('d'),visibility:'hidden'});
  const len=tr.getTotalLength(), dots=[];
  for(let i=0;i<(f.n||4);i++){
    const d=el('circle',{r:f.r||3,fill:col(f.color||'orange'),'class':'particle',color:col(f.color||'orange')},pLayer);
    d.style.display='none'; dots.push({el:d,off:i/(f.n||4)});
  }
  REG[f.id]={type:'flow',path:tr,len,dots,speed:f.speed||.2};
});

/* ---------- orbits（轨道环 + 轨道粒子） ---------- */
(CONFIG.orbits||[]).forEach(o=>{
  let ring=null;
  if(o.ring!==false){
    ring=el('ellipse',{id:'ring-'+o.id,'class':'loop-anim',cx:o.cx,cy:o.cy,rx:o.rx,ry:o.ry,
      fill:'none',stroke:col(o.color||'amber'),'stroke-width':1.5,'stroke-dasharray':'10,8',opacity:0});
    if(o.reverse)ring.style.animationDirection='reverse';
  }
  const dots=[];
  for(let i=0;i<(o.n||3);i++){
    const d=el('circle',{r:o.r||3,fill:col(o.color||'amber'),'class':'particle',color:col(o.color||'amber')},pLayer);
    d.style.display='none'; dots.push({el:d,phase:i/(o.n||3)*Math.PI*2});
  }
  REG[o.id]={type:'orbit',ring,cx:o.cx,cy:o.cy,rx:o.rx,ry:o.ry,dots,speed:o.speed||1.0};
});

/* ---------- chips ---------- */
(CONFIG.chips||[]).forEach(c=>{
  const g=el('g',{id:c.id,'class':'chip',color:col(c.color)});
  el('rect',{x:c.x-c.w/2,y:c.y-15,width:c.w,height:30,rx:8,fill:fill(c.color),stroke:col(c.color),'stroke-width':1},g);
  const t=el('text',{x:c.x,y:c.y+5,fill:'#e2e8f0','font-size':12,'text-anchor':'middle'},g);
  t.textContent=c.text;
  REG[c.id]={type:'chip',el:g};
});

/* ---------- notes（说明框） ---------- */
(CONFIG.notes||[]).forEach(n=>{
  const g=el('g',{id:n.id,'class':'note',color:col(n.color)});
  const rect=el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:8,fill:fill(n.color).replace(/[\d.]+\)$/,'0.12)'),
    stroke:col(n.color),'stroke-width':1},g);
  if(n.dashed)rect.setAttribute('stroke-dasharray','4,4');
  (n.lines||[]).forEach(l=>{
    const t=el('text',{x:n.x+n.w/2,y:n.y+(l.dy||28),fill:col(l.color||'slate'),'font-size':l.size||12,'text-anchor':'middle'},g);
    t.textContent=l.text;
  });
  REG[n.id]={type:'note',el:g};
});

/* ---------- pops（弹出标注） ---------- */
(CONFIG.pops||[]).forEach(p=>{
  const t=el('text',{id:p.id,'class':'popbase',x:p.x,y:p.y,fill:col(p.color||'amber'),
    'font-size':p.size||15,'font-weight':600,'text-anchor':p.anchor||'middle'});
  t.textContent=p.text;
  REG[p.id]={type:'pop',el:t};
});

/* ---------- metrics（数字滚动） ---------- */
(CONFIG.metrics||[]).forEach(m=>{
  const t=el('text',{id:m.id,x:m.x,y:m.y,fill:col(m.color||'cyan'),'font-size':m.size||15,
    'font-weight':600,'text-anchor':'middle',opacity:0});
  t.textContent=(m.prefix||'')+(0).toFixed(m.decimals===undefined?1:m.decimals)+(m.suffix||'');
  if(m.note){
    const nt=el('text',{id:m.id+'-note',x:m.x,y:m.y+(m.note.dy||30),fill:col(m.note.color||'dim'),
      'font-size':m.note.size||11,'text-anchor':'middle',opacity:0});
    nt.textContent=m.note.text;
  }
  const r={type:'metric',el:t,cfg:m,start:null}; REG[m.id]=r; METRICS.push(r);
});

/* ---------- bursts（冲击波） ---------- */
(CONFIG.bursts||[]).forEach(b=>{
  const c=el('circle',{id:b.id,'class':'burst-base',cx:b.x,cy:b.y,r:b.r||72,fill:'none',
    stroke:col(b.color||'cyan'),'stroke-width':2});
  REG[b.id]={type:'burst',el:c};
});

/* ---------- 动作分发 ---------- */
const activeFlows=new Set(), activeOrbits=new Set();
function act(id,t){
  const r=REG[id]; if(!r)return;
  switch(r.type){
    case 'node': case 'chip': case 'note': r.el.classList.add('on'); break;
    case 'edge': if(r.mode==='draw')r.el.style.strokeDashoffset=0; else r.el.style.opacity=1; break;
    case 'flow': r.dots.forEach(d=>d.el.style.display=''); activeFlows.add(r); break;
    case 'orbit': if(r.ring)r.ring.style.opacity=.8; r.dots.forEach(d=>d.el.style.display=''); activeOrbits.add(r); break;
    case 'pop': r.el.classList.add('pop'); break;
    case 'metric': r.el.style.opacity=1; r.start=r.start===null?(t!==undefined?t:vt):r.start;
      const nt=document.getElementById(id+'-note'); if(nt)nt.style.opacity=1; break;
    case 'burst': r.el.classList.add('go'); break;
  }
}

/* ---------- 字幕 ---------- */
const capText=$('#cap-text'), capIdx=$('#cap-idx');
const SCENES=CONFIG.scenes||[];
function setCap(s,i){
  capText.style.opacity=0;
  setTimeout(()=>{capText.textContent=s;
    capIdx.textContent=String(i+1).padStart(2,'0')+'/'+String(SCENES.length).padStart(2,'0');
    capText.style.opacity=1;},180);
}

/* ---------- 分镜执行 ---------- */
let vt=0,last=null,idx=0,playing=true;
function runScenes(){
  while(idx<SCENES.length&&vt>=SCENES[idx].t){
    const sc=SCENES[idx];
    if(sc.cap!==undefined)setCap(sc.cap,idx);
    let ci=0;
    (sc.on||[]).forEach(id=>{
      const r=REG[id];
      if(r&&r.type==='chip'){const d=ci*180;setTimeout(()=>act(id,sc.t),d);ci++;}
      else act(id,sc.t);
    });
    idx++;
  }
}

/* ---------- 数字滚动 ---------- */
function updateMetrics(){
  METRICS.forEach(r=>{
    if(r.start===null)return;
    const p=Math.min(1,Math.max(0,(vt-r.start)/(r.cfg.dur||1.8)));
    const e=1-Math.pow(1-p,3), v=r.cfg.to*e, d=r.cfg.decimals===undefined?1:r.cfg.decimals;
    r.el.textContent=(r.cfg.prefix||'')+v.toFixed(d)+(r.cfg.suffix||'');
  });
}

/* ---------- 粒子推进 ---------- */
function updateParticles(){
  activeFlows.forEach(r=>{
    r.dots.forEach(d=>{
      const t=((vt*r.speed+d.off)%1+1)%1;
      const p=r.path.getPointAtLength(t*r.len);
      d.el.setAttribute('cx',p.x); d.el.setAttribute('cy',p.y);
    });
  });
  activeOrbits.forEach(r=>{
    r.dots.forEach(d=>{
      const a=vt*r.speed+d.phase;
      d.el.setAttribute('cx',r.cx+r.rx*Math.cos(a));
      d.el.setAttribute('cy',r.cy+r.ry*Math.sin(a));
    });
  });
}

/* ---------- 主循环 ---------- */
function tick(now){
  if(last===null)last=now;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing){vt+=dt;runScenes();}
  updateMetrics(); updateParticles();
  requestAnimationFrame(tick);
}

/* 调试钩子：?t=秒 → 直接跳到该时刻（headless 截图验证用） */
const dbgT=parseFloat(new URLSearchParams(location.search).get('t'));
if(!isNaN(dbgT)){svg.classList.add('instant');vt=dbgT;runScenes();updateMetrics();updateParticles();}
requestAnimationFrame(tick);

/* ---------- 控制 ---------- */
$('#btn-pp').onclick=()=>{playing=!playing;$('#btn-pp').textContent=playing?'⏸':'▶';};
$('#btn-rp').onclick=()=>{
  document.querySelectorAll('.node,.chip,.note').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.popbase').forEach(e=>e.classList.remove('pop'));
  document.querySelectorAll('.burst-base').forEach(e=>e.classList.remove('go'));
  Object.values(REG).forEach(r=>{
    if(r.type==='edge'){if(r.mode==='draw')r.el.style.strokeDashoffset=r.el.dataset.len;else r.el.style.opacity=0;}
    if(r.type==='flow'){r.dots.forEach(d=>d.el.style.display='none');activeFlows.delete(r);}
    if(r.type==='orbit'){if(r.ring)r.ring.style.opacity=0;r.dots.forEach(d=>d.el.style.display='none');activeOrbits.delete(r);}
  });
  METRICS.forEach(r=>{r.start=null;r.el.style.opacity=0;
    r.el.textContent=(r.cfg.prefix||'')+(0).toFixed(r.cfg.decimals===undefined?1:r.cfg.decimals)+(r.cfg.suffix||'');
    const nt=document.getElementById(r.cfg.id+'-note'); if(nt)nt.style.opacity=0;});
  vt=0;idx=0;if(SCENES[0]&&SCENES[0].cap!==undefined)setCap(SCENES[0].cap,0);
};
})();
</script>
</body>
</html>
