site_name: 动手学 Agent RAG
site_url: https://ming-h.github.io/hands-on-agent-rag/
site_description: 基于开源项目 Tally 的证据式问答系统教程
repo_url: https://github.com/Ming-H/hands-on-agent-rag
repo_name: hands-on-agent-rag
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: brown
      toggle: {icon: material/weather-night, name: 暗色}
    - scheme: slate
      primary: brown
      toggle: {icon: material/weather-sunny, name: 亮色}
  features:
    - navigation.tabs
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: false
nav:
  - 首页: index.md
  - 前言: preface.md
  - 第一部 知识入库:
      - ch01 为什么你的 RAG Demo 上不了线: ch01.md
      - ch02 PDF 到大模型可读的内容: ch02.md
      - ch03 表格感知分块: ch03.md
      - ch04 存储选型: ch04.md
      - ch05 双轨检索与 embedding 消融: ch05.md
  - 第二部 求证闸门:
      - ch06 查询理解与路由: ch06.md
      - ch07 生成与引用: ch07.md
      - ch08 对账闸门: ch08.md
      - ch09 口径守卫: ch09.md
  - 第三部 Agent 化:
      - ch10 ReAct 工具环: ch10.md
      - ch11 Planner 与 Memory: ch11.md
  - 第四部 诚实:
      - ch12 评测即测试: ch12.md
      - ch13 边界账本: ch13.md
  - 附录:
      - A 术语表: appendix-a-glossary.md
      - B 环境与通道配置: appendix-b-setup.md
      - C Tally 代码地图: appendix-c-codemap.md
      - D 决策记录索引: appendix-d-decisions.md
