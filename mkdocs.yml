site_name: 动手学 Agent RAG
site_url: https://ming-h.github.io/hands-on-agent-rag/
site_description: 基于开源项目 Tally 的证据式问答系统教程
repo_url: https://github.com/Ming-H/hands-on-agent-rag
repo_name: hands-on-agent-rag
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: brown
      toggle: {icon: material/weather-night, name: 暗色}
    - scheme: slate
      primary: brown
      toggle: {icon: material/weather-sunny, name: 亮色}
  features:
    - navigation.tabs
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: false
nav:
  - 首页: index.md
  - 前言: preface.md
  - 第一部分 全景:
      - ch01 系统全景：从 RAG 到 Agentic RAG: ch01.md
  - 第二部分 语料与检索:
      - ch02 文档摄取：从原始文件到可信语料: ch02.md
      - ch03 文本切分：语义单元与表格保全: ch03.md
      - ch04 存储与索引：选型方法与工程不变量: ch04.md
      - ch05 检索设计：词法、语义与 RRF 融合: ch05.md
  - 第三部分 生成与验证:
      - ch06 生成与引用：让每个答案可对账: ch06.md
      - ch07 出口验证：三态闸门与口径防线: ch07.md
  - 第四部分 Agent 架构:
      - ch08 LLM 接入层：模型选型与多通道适配: ch08.md
      - ch09 查询理解与路由：LLM 提议，规则裁决: ch09.md
      - ch10 任务规划：多跳分解与只删不造: ch10.md
      - ch11 工具调用与 Agent 循环：护栏工程: ch11.md
      - ch12 记忆系统：短期、长期与读写闸门: ch12.md
  - 第五部分 评测与可靠性:
      - ch13 评测工程：真值集、LLM 裁判与 CI 门槛: ch13.md
      - ch14 可靠性与系统总装：错误传播、安全失败与设计迁移: ch14.md
  - 附录:
      - A 术语表: appendix-a-glossary.md
      - B 环境与安装: appendix-b-setup.md
      - C Tally 代码地图: appendix-c-codemap.md
      - D 决策记录索引: appendix-d-decisions.md
      - E 业界前沿地图: appendix-e-frontier-map.md
      - F Agentic RAG 设计画布: appendix-f-design-canvas.md
      - G 从原型到生产：检查清单: appendix-g-production-checklist.md
